    <!---- BEGIN NAVIGATION BAR --->
    <div class= "topnav">

        <a class = "active" href = "index.html"> <img width = "128px" src = "NCCA_Logo+Title.png"></a>

    <!--- END NAVIGATION BAR --->
    <div class = "spacer"></div>
    <div class = "formcarry-container">
      <form action = "#" method = "POST" class = "formcarry-form">

        <label for = "prefix">Name Prefix</label>
        <input type = "text" id = "prefix" name = "namePrefix" required />
        
        <label for = "firstname">First Name</label>
        <input type = "text" id = "name1" name = "firstName" required />

        <label for = "lastname">Last Name</label>
        <input type = "text" id = "name2" name = "lastName" required />
        
        <label for = "email">Your Email Address</label>
        <input type = "email" id = "email" name = "email" required />

        <label for = "message">Your Message</label>
        <textarea name = "message" id = "message" cols = "30" rows = "10"></textarea>

        <button type = "submit">Send</button>
      </form>
    </div>
    <div class = "spacer"></div>
  </body>
