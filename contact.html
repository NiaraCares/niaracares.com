    <main>
      <div class = "form-container-container">
        <div class = "form-container">
          <h1><strong>Contact Form</strong></h1>
          <p>Please contact me for any questions! You can use the form below or email me at qa@niaracares.com.</p>
          <form action = "#" method = "POST" class = "form">
            <!---
            <label for = "prefix">Name Prefix</label>
            <input type = "text" id = "prefix" name = "namePrefix" required />
            --->
            <div class = "float1">
              <label for = "first-name">First Name</label>
              <input type = "text" id = "first-name" placeholder = "Lorem" required />
            </div>
            
            <div class = "float1">
              <label for = "last-name">Last Name</label>
              <input type = "text" id = "last-name" placeholder = "Ipsum" required />
            </div>

            <div class = "float1">
              <label for = "email">Your Email Address<sup class = "required-label">*</sup></label>
              <input type = "email" id = "email" placeholder = "example@email.com" required />
            </div>

            <div class = "float1">
              <label for = "subject">Email Subject</label>
              <input type = "text" id = "subject" placeholder = "Subject" required />
            </div>
            
            <div class = "float2">
              <label for = "message">Your Message</label>
              <textarea name = "message" id = "message" cols = ""60 rows = "10"></textarea>
            </div>

            <div class = "button">
              <button type = "submit">Send</button>
            </div>
          </form>
        </div>
      </div>
